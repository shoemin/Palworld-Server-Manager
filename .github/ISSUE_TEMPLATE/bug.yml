name: Bug report
description: Something isn't working the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: parent-epic
    attributes:
      label: Parent Epic
      description: >-
        Which Epic is this a bounded child of (e.g. "#16")? Filling this in does not create the
        real GitHub link — run `gh issue edit <issue> --parent <epic>` separately once the issue exists.
      placeholder: "#16"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact steps to reproduce, if known. If not reliably reproducible, say so explicitly.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who/what is affected, and how severely?
    validations:
      required: true
  - type: textarea
    id: safety-risk
    attributes:
      label: Safety/Data Risk
      description: Could this cause data loss, a save-corruption risk, or a security issue? If unsure, say so — do not assume "no".
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, exact versions/commit, diagnostic bundle excerpts, etc.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope for the fix? What is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Which other issues must be resolved first? If none, say "None" explicitly.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Applicable Invariants
      description: >-
        For v0.5 work, cite the applicable invariant IDs from docs/developer/v0.5-invariants.md
        (e.g. HOST-001, AUTH-003) — not a paraphrase. Not v0.5 work? Say "N/A".
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What must be true for this to be considered fixed?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Required tests/validation commands — how will the fix be verified?
    validations:
      required: true
  - type: textarea
    id: allowed-decisions
    attributes:
      label: Allowed Implementation Decisions
      description: Which implementation/architecture decisions is Claude authorized to make while executing this issue, without escalating?
    validations:
      required: true
  - type: textarea
    id: stop-conditions
    attributes:
      label: Product Decision / Stop Conditions
      description: What findings or ambiguities require stopping and setting Workflow State = Product Decision, rather than deciding unilaterally?
    validations:
      required: true
  - type: textarea
    id: review-gate
    attributes:
      label: Review Gate
      description: What checkpoint(s) require ChatGPT/product-owner review before proceeding?
    validations:
      required: true
  - type: textarea
    id: after-pass
    attributes:
      label: After PASS
      description: >-
        Exact next action after this issue passes its SECOND (PR/Codex-stage) review checkpoint —
        e.g. "merge". The first checkpoint's action is always fixed (open the PR); never answer
        "open the PR" here.
    validations:
      required: true
