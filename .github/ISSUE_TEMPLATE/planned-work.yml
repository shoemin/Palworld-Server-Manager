name: Planned work
description: Scoped, planned implementation work tracked through the Project workflow.
title: "[Planned] "
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What is this work trying to accomplish, in one or two sentences?
    validations:
      required: true
  - type: input
    id: parent-epic
    attributes:
      label: Parent Epic
      description: >-
        Which Epic issue is this a bounded child of (e.g. "#16")? A parent Epic is never itself
        an executable Ready unit — every execution issue needs one. Filling this in here does not
        create the actual GitHub sub-issue link; that still has to be set explicitly (e.g. via
        `gh issue edit <issue> --parent <epic>` or the equivalent GraphQL mutation) once the issue exists.
      placeholder: "#16"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed now? What prior decision or issue does it follow from?
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is explicitly included in this issue?
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: What is explicitly NOT included, to prevent scope creep? If nothing, say so explicitly rather than leaving this blank.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Which other issues must be resolved first? If none, say "None" explicitly.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Applicable Invariants
      description: >-
        For v0.5 work, cite the applicable invariant IDs from docs/developer/v0.5-invariants.md
        (e.g. HOST-001, AUTH-003) — not a paraphrase. Not v0.5 work? Say "N/A".
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What must be true for this issue to be considered done?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Required tests/validation commands — how will this be verified (tests, manual checks, etc.)?
    validations:
      required: true
  - type: textarea
    id: allowed-decisions
    attributes:
      label: Allowed Implementation Decisions
      description: Which implementation/architecture decisions is Claude authorized to make while executing this issue, without escalating?
    validations:
      required: true
  - type: textarea
    id: stop-conditions
    attributes:
      label: Product Decision / Stop Conditions
      description: What findings or ambiguities require stopping and setting Workflow State = Product Decision, rather than deciding unilaterally?
    validations:
      required: true
  - type: textarea
    id: documentation-impact
    attributes:
      label: Documentation Impact
      description: Does this require doc changes? Which pages?
    validations:
      required: false
  - type: textarea
    id: field-validation
    attributes:
      label: Field Validation
      description: Does this need real-world (non-CI) validation? What kind?
    validations:
      required: false
  - type: textarea
    id: review-gate
    attributes:
      label: Review Gate
      description: What checkpoint(s) require ChatGPT/product-owner review before proceeding?
    validations:
      required: true
  - type: textarea
    id: after-pass
    attributes:
      label: After PASS
      description: >-
        What is the exact next action once this issue passes its SECOND (PR/Codex-stage) review
        checkpoint — e.g. "merge" or "hand off to #NN"? The first checkpoint's action is always
        fixed by the workflow itself (open the PR); this field is never "open the PR".
    validations:
      required: true
