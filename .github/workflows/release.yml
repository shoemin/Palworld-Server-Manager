name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build/release, for example v0.4.0-alpha.1
        required: true
        type: string

permissions:
  contents: write

env:
  PACK_ID: ShoeMin.PalworldServerManager
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    name: Build, package, and release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Resolve release tag, version, and channel
        id: release_info
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.tag }}'
          } else {
              '${{ github.ref_name }}'
          }

          # SemVer-ish: v0.4.0, v0.4.0-alpha.1, v0.4.0-beta.1, v0.4.0-rc.1
          # Major/minor/patch use the official SemVer numeric-identifier grammar (no leading
          # zeros, e.g. "01") rather than a loose \d+: Velopack's SemanticVersion.Parse int-parses
          # and re-stringifies these three components (so "v01.2.3" packs as "1.2.3", not
          # "01.2.3"), and downstream steps construct exact package filenames directly from this
          # $version output - a leading-zero tag would pass this check but then never match the
          # actual packaged filename, causing the release to fail closed later instead of here at
          # the source. Rejecting it up front is simpler and clearer than re-normalizing the
          # version everywhere it's used to build a filename.
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Release tag '$tag' is not supported. Use SemVer-style tags such as v0.4.0, v0.4.0-alpha.1, or v0.4.0-rc.1 (major/minor/patch must not have leading zeros)."
          }

          $version = $Matches.version
          $isPrerelease = $version.Contains('-')
          # Stable tags pack to the 'win' channel; any prerelease suffix (-alpha., -beta., -rc., ...)
          # packs to 'win-beta'. This must exactly match ApplicationUpdateService/VelopackUpdateBackend's
          # channel names (see src/PalworldServerManager.Core/Services/Update/VelopackUpdateBackend.cs) -
          # a stable build must never be packed to win-beta, and vice versa.
          $channel = if ($isPrerelease) { 'win-beta' } else { 'win' }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

          Write-Host "Release tag: $tag"
          Write-Host "Package version: $version"
          Write-Host "GitHub prerelease: $isPrerelease"
          Write-Host "Velopack channel: $channel"

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_info.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points at checked-out commit
        id: verify_tag
        shell: pwsh
        run: |
          $expected = git rev-list -n 1 '${{ steps.release_info.outputs.tag }}'
          $actual = git rev-parse HEAD
          if ($expected -ne $actual) {
              throw "Tag verification failed. Tag points to $expected but checkout is $actual."
          }
          "commit_sha=$actual" >> $env:GITHUB_OUTPUT
          Write-Host "Verified tag ${{ steps.release_info.outputs.tag }} at $actual"

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore pinned dotnet tools (vpk)
        shell: pwsh
        run: dotnet tool restore

      - name: Build and run self-tests
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Set up Python for documentation validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate documentation (strict) as a release gate
        shell: pwsh
        run: |
          pip install -r docs\requirements.txt
          mkdocs build --strict

      - name: Publish self-contained win-x64 application for packaging
        shell: pwsh
        run: |
          # Not single-file: Velopack needs individual files to diff for delta packages and to
          # apply its own bootstrap/shim correctly. This is a different publish shape than the
          # plain single-file exe scripts\publish.ps1 produces (that script is unrelated to
          # Velopack packaging and remains available for a manual non-installer build).
          dotnet publish src\PalworldServerManager.App\PalworldServerManager.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version='${{ steps.release_info.outputs.version }}' `
            -p:InformationalVersion='${{ steps.release_info.outputs.version }}' `
            -o release-work\publish

      - name: Verify checked-out LICENSE bytes match the canonical Git blob
        shell: pwsh
        run: |
          # alpha.1's real installed-mode field test found that the OLD LICENSE check here only
          # proved the checked-out working copy was consistent with itself (repo copy vs. its own
          # copy in the pack dir) - never that either one actually matched the LICENSE blob
          # committed in the release tag. A windows-latest runner's default core.autocrlf
          # behavior normalized the committed LF LICENSE to CRLF on checkout, and the old check
          # couldn't see that because it never compared against the canonical Git object at all.
          # .gitattributes (LICENSE text eol=lf) now makes checkout deterministic, but this step
          # verifies it directly rather than trusting the attribute alone. Plain `git hash-object`
          # (without --no-filters) is deliberately NOT used, because Git would run its own
          # clean/EOL filter first and could hide a real working-tree divergence; --no-filters
          # forces Git to compute the blob ID of the RAW bytes actually sitting on disk.
          $ErrorActionPreference = 'Stop'
          $committedBlobId = git rev-parse HEAD:LICENSE
          $rawWorktreeBlobId = git hash-object --no-filters LICENSE
          if ($committedBlobId -ne $rawWorktreeBlobId) {
              throw "Checked-out LICENSE bytes do not match the canonical Git blob committed in this release tag. " +
                    "Committed blob: $committedBlobId; raw working-tree blob: $rawWorktreeBlobId. " +
                    "This usually means checkout normalized line endings - refusing to package a release whose LICENSE " +
                    "cannot be proven byte-identical to what was actually tagged."
          }
          Write-Host "Confirmed: raw working-tree LICENSE bytes match the canonical Git blob committed in this tag (object $committedBlobId)."

      - name: Copy LICENSE into the packaged application payload
        shell: pwsh
        run: |
          # The PolyForm Noncommercial License requires redistributed copies to preserve the
          # license terms/URL and the "Required Notice" - so every packaged distributable
          # (installer, portable zip, full nupkg) must actually contain LICENSE alongside the
          # application, not just the source repository. Copies the canonical file verbatim
          # (never rewrites its text) and fails closed if anything about the copy looks wrong,
          # rather than silently shipping a release missing the license. The previous step
          # already proved the source LICENSE about to be copied here matches the canonical Git
          # blob, so byte-identity all the way through the packaging pipeline transitively
          # proves byte-identity with the canonical tagged LICENSE too.
          $ErrorActionPreference = 'Stop'
          $repoLicense = Join-Path $PWD 'LICENSE'
          if (-not (Test-Path $repoLicense)) {
              throw "Repository LICENSE not found at '$repoLicense'."
          }

          $packLicense = Join-Path $PWD 'release-work\publish\LICENSE'
          Copy-Item -Path $repoLicense -Destination $packLicense -Force
          if (-not (Test-Path $packLicense)) {
              throw "LICENSE was not copied into the pack directory at '$packLicense'."
          }

          $repoHash = (Get-FileHash -Path $repoLicense -Algorithm SHA256).Hash
          $packHash = (Get-FileHash -Path $packLicense -Algorithm SHA256).Hash
          if ($repoHash -ne $packHash) {
              throw "Copied LICENSE in the pack directory is not byte-identical to the repository LICENSE."
          }
          Write-Host "LICENSE copied into the pack directory and verified byte-identical to the repository LICENSE."

      - name: Write release notes
        id: notes
        shell: pwsh
        run: |
          $version = '${{ steps.release_info.outputs.version }}'
          $isPrerelease = '${{ steps.release_info.outputs.is_prerelease }}' -eq 'true'
          $notesPath = Join-Path $PWD 'release-work\release-notes.md'
          New-Item -ItemType Directory -Force -Path (Split-Path $notesPath) | Out-Null

          $lines = New-Object System.Collections.Generic.List[string]
          if ($isPrerelease) {
              $lines.Add('> **This is an experimental prerelease build for testing.** It is not recommended for production Palworld servers. Back up server data independently before using it.')
              $lines.Add('')
          }
          $lines.Add("Palworld Server Manager $version")
          $lines.Add('')
          $lines.Add('- Setup.exe installer (per-user) and a portable Velopack package, alongside the existing native Dashboard.')
          $lines.Add('- LAN discovery, pairing, remote Dashboard, and .palserver transfer between paired Manager instances.')
          $lines.Add('- Manager process reattachment: closing/restarting the Manager does not lose track of a running Palworld server.')
          $lines.Add('- In-app update checking, downloading, and Install and Restart, designed so a running Palworld server is never saved, stopped, or restarted by a Manager update.')
          $lines.Add('')
          $lines.Add('**Designed and automated-tested; real running-Palworld self-update field validation is still pending.** See the project documentation for the exact field-test plan before this is considered field-proven.')

          $lines -join "`n" | Set-Content -Path $notesPath -Encoding utf8
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          Write-Host (Get-Content $notesPath -Raw)

      - name: Download previous release of this channel (for delta packages)
        id: download_previous
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-work\velopack | Out-Null

          # Pinned vpk 1.2.0's --pre flag defaults to false ("Get latest pre-release instead
          # of stable"). This project's real public releases are GitHub prereleases whenever
          # the channel is win-beta (Prerelease) - so without --pre, this download would never
          # find the previous win-beta release (verified directly against this repository: a
          # real read-only `vpk download github` without --pre reported no releases for
          # win-beta even with v0.4.0-alpha.1 already published, while the same command with
          # --pre found it immediately). For the win (Stable) channel, --pre must NOT be
          # passed, since Stable intentionally only ever looks at non-prerelease releases.
          $downloadArgs = @(
              '--repoUrl', $env:REPO_URL,
              '--channel', '${{ steps.release_info.outputs.channel }}',
              '--outputDir', 'release-work\velopack',
              '--token', $env:GH_TOKEN
          )
          if ('${{ steps.release_info.outputs.is_prerelease }}' -eq 'true') {
              $downloadArgs += '--pre'
          }

          dotnet vpk download github @downloadArgs
          if ($LASTEXITCODE -ne 0) { throw "vpk download exited with code $LASTEXITCODE" }

      - name: Report delta package availability
        id: delta_status
        shell: pwsh
        run: |
          # vpk download github can exit 0 even when it found no previous release at all
          # (observed directly in release run 32553241615: "No releases found... Aborting"
          # with exit code 0) - so the download step's success/failure alone cannot tell us
          # whether a previous package is actually available for vpk pack to diff against.
          # Determine this from the actual downloaded file state instead, and distinguish
          # "genuinely nothing to download yet" from "the download step itself failed".
          $dir = 'release-work\velopack'
          $previousNupkg = if (Test-Path $dir) { Get-ChildItem -Path $dir -Filter "$env:PACK_ID-*-full.nupkg" -ErrorAction SilentlyContinue | Select-Object -First 1 } else { $null }
          $previousFound = $null -ne $previousNupkg

          "previous_found=$($previousFound.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($previousFound) {
              Write-Host "Previous '${{ steps.release_info.outputs.channel }}' release found ($($previousNupkg.Name)); vpk pack will generate a delta package."
          } elseif ('${{ steps.download_previous.outcome }}' -eq 'success') {
              Write-Host "No previous '${{ steps.release_info.outputs.channel }}' release exists yet - this is expected for the first release on this channel. Packaging continues with a full package only; this is not a failure."
          } else {
              Write-Host "::warning::Could not retrieve a previous '${{ steps.release_info.outputs.channel }}' release (the download step failed) - continuing with a full package only, per the intended best-effort delta behavior."
          }

      - name: Pack Velopack release
        shell: pwsh
        run: |
          dotnet vpk pack `
            --packId $env:PACK_ID `
            --packVersion '${{ steps.release_info.outputs.version }}' `
            --channel '${{ steps.release_info.outputs.channel }}' `
            --packDir release-work\publish `
            --packTitle "Palworld Server Manager" `
            --packAuthors shoemin `
            --mainExe PalworldServerManager.exe `
            --runtime win-x64 `
            --instLocation PerUser `
            --releaseNotes '${{ steps.notes.outputs.notes_path }}' `
            --outputDir release-work\velopack
          if ($LASTEXITCODE -ne 0) { throw "vpk pack exited with code $LASTEXITCODE" }

      - name: Determine and verify the intended public release asset set
        id: verify_assets
        shell: pwsh
        run: |
          # Determines exactly which locally-produced files will actually become public
          # GitHub Release assets, mirroring pinned Velopack 1.2.0's real upload behavior
          # (audited directly from source: src/vpk/Velopack.Deployment/GitHubRepository.cs,
          # src/vpk/Velopack.Core/DefaultName.cs, src/lib-csharp/Util/CoreUtil.cs @ tag 1.2.0)
          # rather than assuming every local file in the output directory is public. This
          # list also drives SHA256SUMS.txt below, so the public checksum manifest can never
          # list a file a consumer cannot actually download.
          $ErrorActionPreference = 'Stop'
          $channel = '${{ steps.release_info.outputs.channel }}'
          $dir = 'release-work\velopack'

          # Setup.exe and Portable.zip are always channel-suffixed, even for the default "win"
          # channel (DefaultName.GetSuggestedSetupName/GetSuggestedPortableName always apply
          # "-<channel>") - verified locally with a real vpk pack run against win-beta before
          # trusting this in CI.
          $setupName = "$env:PACK_ID-$channel-Setup.exe"
          $portableName = "$env:PACK_ID-$channel-Portable.zip"
          $releasesIndexName = "releases.$channel.json"

          $publicAssets = [System.Collections.Generic.List[string]]::new()
          $publicAssets.Add($setupName)
          $publicAssets.Add($portableName)
          $publicAssets.Add($releasesIndexName)

          # The full/delta nupkg filename drops the channel suffix entirely when channel is
          # "win" (DefaultName.GetSuggestedReleaseName's Windows-default-channel special case).
          # This is constructed explicitly from $version/$channel rather than discovered by a
          # "$env:PACK_ID-*-full.nupkg" glob: "Download previous release of this channel" above
          # deliberately downloads the PREVIOUS same-channel release's full nupkg into this same
          # output directory (so vpk pack's delta mode can diff against it), and vpk pack does
          # not remove that input file afterward - so on every release after a channel's first,
          # this directory legitimately contains two "*-full.nupkg" matches (the old downloaded
          # one and the newly packed one), and a glob+count-based check would either grab the
          # wrong one or fail closed on every subsequent release. Constructing the current
          # version's exact filename sidesteps that ambiguity entirely. SemanticVersion's
          # ToNormalizedString (verified against pinned Velopack 1.2.0 source) is exactly
          # "{major}.{minor}.{patch}[-{prerelease}]" for any version with no 4th (Revision)
          # component and no build metadata - which is guaranteed here, since this workflow's own
          # tag regex above never allows a 4-component version or "+metadata" in the first place -
          # so $version is already in that exact normalized form.
          $version = '${{ steps.release_info.outputs.version }}'
          if ($channel -eq 'win') {
              $fullNupkgName = "$env:PACK_ID-$version-full.nupkg"
              $deltaNupkgName = "$env:PACK_ID-$version-delta.nupkg"
          } else {
              $fullNupkgName = "$env:PACK_ID-$version-$channel-full.nupkg"
              $deltaNupkgName = "$env:PACK_ID-$version-$channel-delta.nupkg"
          }
          $publicAssets.Add($fullNupkgName)
          "full_nupkg_name=$fullNupkgName" >> $env:GITHUB_OUTPUT

          if (Test-Path (Join-Path $dir $deltaNupkgName)) {
              Write-Host "Delta package present, including in the public asset set: $deltaNupkgName"
              $publicAssets.Add($deltaNupkgName)
          } else {
              Write-Host "No delta package produced for this version (expected for the first release on a channel) - not fabricating a delta entry."
          }

          # GitHubRepository.UploadMissingAssetsAsync uploads a legacy file named EXACTLY
          # "RELEASES" (no channel suffix) if and only if the channel is the default Windows
          # channel ("win"). CoreUtil.GetReleasesFileName (called locally by vpk pack via
          # ReleaseEntryHelper.UpdateReleaseFilesAsync) special-cases "win" the same way: for
          # channel "win" the LOCAL file it writes is also the unsuffixed "RELEASES" - the
          # "RELEASES-<channel>" suffixed form only exists for every OTHER (non-default)
          # channel, e.g. "RELEASES-win-beta". So for "win" specifically, the local and
          # uploaded filenames are identical; for every other channel, a "RELEASES-<channel>"
          # file is written locally for vpk's own bookkeeping but never uploaded at all. vpk
          # pack also always writes a local "assets.<channel>.json" (BuildAssets.Write), which
          # likewise is never uploaded for any channel - both categories of local-only file are
          # deliberately excluded here rather than included by directory-globbing.
          # (Corrected per @chatgpt-codex-connector[bot] review on PR #9: an earlier version of
          # this comment incorrectly described "RELEASES-<channel>" as vpk pack's local
          # filename for every channel including "win", which would have implied this step's
          # $publicAssets.Add('RELEASES') / Test-Path check was wrong - the code was always
          # correct per CoreUtil.GetReleasesFileName's "win" special-case; only this comment,
          # and the mirroring prose in docs/developer/release-process.md, needed fixing.)
          if ($channel -eq 'win') {
              $publicAssets.Add('RELEASES')
          }

          $missing = $publicAssets | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) {
              throw "Release packaging did not produce required public asset(s): $($missing -join ', ')"
          }

          Write-Host "Intended public release asset set (channel '$channel'):"
          $publicAssets | Sort-Object | ForEach-Object { Write-Host " - $_" }

          # -AsArray guards against ConvertTo-Json's single-element pipeline collapse (piping a
          # one-item collection would otherwise serialize as a bare JSON string, not an array) -
          # always at least 4 entries in practice here, but this keeps downstream ConvertFrom-Json
          # parsing correct unconditionally rather than relying on that.
          $publicAssetsJson = $publicAssets | ConvertTo-Json -Compress -AsArray
          "public_assets_json=$publicAssetsJson" >> $env:GITHUB_OUTPUT

          Write-Host ""
          Write-Host "All files present in '$dir' (including local-only packaging metadata, not all of which is public):"
          Get-ChildItem $dir | ForEach-Object { Write-Host " - $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Verify LICENSE bytes inside the portable zip and full nupkg
        shell: pwsh
        run: |
          # Confirms the LICENSE copied into the pack directory doesn't just have an entry
          # present inside the redistributable package contents, but that entry's actual bytes
          # are byte-identical to the canonical (Git-blob-verified) source LICENSE - a normalized
          # text comparison would not have caught alpha.1's real LF/CRLF divergence, so this
          # extracts each archive entry and SHA-256-compares raw bytes, not text. The portable
          # zip and full nupkg are both plain zip archives, so entries can be read directly
          # without extracting the whole (large) archive.
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $channel = '${{ steps.release_info.outputs.channel }}'
          $dir = 'release-work\velopack'
          $canonicalHash = (Get-FileHash -Path 'LICENSE' -Algorithm SHA256).Hash

          function Get-ZipEntrySha256([string]$ZipPath, [string]$EntryPath) {
              $zip = [System.IO.Compression.ZipFile]::OpenRead($ZipPath)
              try {
                  $entry = $zip.Entries | Where-Object { $_.FullName -eq $EntryPath }
                  if (-not $entry) { return $null }
                  $sha256 = [System.Security.Cryptography.SHA256]::Create()
                  try {
                      $stream = $entry.Open()
                      try { return [System.BitConverter]::ToString($sha256.ComputeHash($stream)).Replace('-', '') }
                      finally { $stream.Dispose() }
                  }
                  finally { $sha256.Dispose() }
              }
              finally { $zip.Dispose() }
          }

          $portableZip = Join-Path $dir "$env:PACK_ID-$channel-Portable.zip"
          $portableHash = Get-ZipEntrySha256 -ZipPath $portableZip -EntryPath 'current/LICENSE'
          if (-not $portableHash) {
              throw "Portable package '$portableZip' does not contain LICENSE at 'current/LICENSE'."
          }
          if ($portableHash -ne $canonicalHash) {
              throw "Portable package '$portableZip' entry 'current/LICENSE' (SHA-256 $portableHash) is not byte-identical to the canonical LICENSE (SHA-256 $canonicalHash)."
          }
          Write-Host "Confirmed: portable zip 'current/LICENSE' is byte-identical to the canonical LICENSE (SHA-256 $portableHash)."

          # Uses the exact filename computed in "Determine and verify the intended public
          # release asset set", not a "$env:PACK_ID-*-full.nupkg" glob - on every release after a
          # channel's first, this directory also contains the previous release's downloaded full
          # nupkg (left there deliberately for delta diffing), so a glob could silently pick the
          # WRONG (old) package's LICENSE entry instead of the one this run actually built.
          $fullNupkg = Join-Path $dir '${{ steps.verify_assets.outputs.full_nupkg_name }}'
          $nupkgHash = Get-ZipEntrySha256 -ZipPath $fullNupkg -EntryPath 'lib/app/LICENSE'
          if (-not $nupkgHash) {
              throw "Full package '$fullNupkg' does not contain LICENSE at 'lib/app/LICENSE'."
          }
          if ($nupkgHash -ne $canonicalHash) {
              throw "Full package '$fullNupkg' entry 'lib/app/LICENSE' (SHA-256 $nupkgHash) is not byte-identical to the canonical LICENSE (SHA-256 $canonicalHash)."
          }
          Write-Host "Confirmed: full nupkg 'lib/app/LICENSE' is byte-identical to the canonical LICENSE (SHA-256 $nupkgHash)."

      - name: Verify a real silent install places LICENSE in the installed application
        shell: pwsh
        run: |
          # The portable zip / nupkg checks above prove LICENSE is inside the package *content*,
          # but Setup.exe installs via its own extraction path - only an actual install proves
          # what ends up on disk for an installed user. Runs a real silent install to a scratch
          # directory on this ephemeral runner, verifies LICENSE landed there byte-identical to
          # the repository copy, then cleanly uninstalls (shortcuts, registry key) again.
          #
          # Release run 32553241615 showed that a bare `& $setupExe ...` native-command
          # invocation is not reliable here: PowerShell returned control (with $LASTEXITCODE
          # left blank/unset, not a real nonzero code) while Setup.exe's own log kept producing
          # genuine install progress - file extraction, shortcut creation, the install hook,
          # "Installation completed successfully!" - for roughly two more seconds. That run
          # proved the OLD bare-invocation exit-code capture was unreliable; it did NOT prove
          # Velopack Setup.exe can legitimately return a nonzero exit code for a successful
          # install - a real Start-Process -Wait -PassThru run always returned 0 locally. So a
          # genuine nonzero Process.ExitCode is now treated as a hard failure, never downgraded
          # to a warning just because LICENSE happens to exist.
          $ErrorActionPreference = 'Stop'
          $channel = '${{ steps.release_info.outputs.channel }}'
          $dir = 'release-work\velopack'
          $setupExe = Join-Path $dir "$env:PACK_ID-$channel-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'license-install-check'
          $installLog = Join-Path $env:RUNNER_TEMP 'license-install-check.log'
          $installArgs = @('--silent', '--installto', $installDir, '--log', $installLog)

          try {
              Write-Host "Starting silent install: $setupExe $($installArgs -join ' ')"
              $installProcess = Start-Process -FilePath $setupExe -ArgumentList $installArgs -Wait -PassThru
              Write-Host "Setup.exe process exited with code $($installProcess.ExitCode)."

              if ($installProcess.ExitCode -ne 0) {
                  $logTail = if (Test-Path $installLog) { (Get-Content $installLog -Tail 40) -join "`n" } else { '(no install log was written)' }
                  throw "Setup.exe exited with a nonzero code ($($installProcess.ExitCode)) during the LICENSE verification install - this is a genuine installer failure, not the earlier bare-invocation exit-code-capture bug. Install log tail:`n$logTail"
              }

              # Second, independent guard against the handoff/timing behavior seen in release run
              # 32553241615: Start-Process -Wait -PassThru already gives a trustworthy exit code
              # (checked above), but the actually-installed file is still the ultimate ground
              # truth for "did the install really finish" - bounded, not an arbitrary sleep.
              $installedLicense = Join-Path $installDir 'current\LICENSE'
              $deadline = (Get-Date).AddSeconds(60)
              while (-not (Test-Path $installedLicense) -and (Get-Date) -lt $deadline) {
                  Start-Sleep -Seconds 2
              }

              if (-not (Test-Path $installedLicense)) {
                  $logTail = if (Test-Path $installLog) { (Get-Content $installLog -Tail 40) -join "`n" } else { '(no install log was written)' }
                  throw "Installed application directory is missing LICENSE at '$installedLicense' after waiting up to 60s for installation to complete, even though Setup.exe's process exit code was 0. Install log tail:`n$logTail"
              }

              $repoHash = (Get-FileHash -Path 'LICENSE' -Algorithm SHA256).Hash
              $installedHash = (Get-FileHash -Path $installedLicense -Algorithm SHA256).Hash
              if ($repoHash -ne $installedHash) {
                  throw "Installed LICENSE at '$installedLicense' is not byte-identical to the repository LICENSE."
              }
              Write-Host "Confirmed: a real silent install (exit code 0) placed a byte-identical LICENSE at '$installedLicense'."

              # Corroborating evidence only, never a hard gate: the two checks above (a real zero
              # exit code, and a byte-identical installed LICENSE) are already sufficient on
              # their own. This message is an internal Velopack log string that could plausibly
              # differ by OS locale on a hosted runner, so its absence is a warning, not a failure.
              if (Test-Path $installLog) {
                  $logText = Get-Content $installLog -Raw
                  if ($logText -notmatch 'Installation completed successfully!') {
                      Write-Host "::warning::Setup.exe exited 0 and LICENSE verified, but its log did not contain the expected 'Installation completed successfully!' completion marker - worth a look, though not treated as a failure."
                  }
              }
          }
          finally {
              # Cleanup is intentionally best-effort on this ephemeral runner and must never
              # replace or hide whatever real failure (if any) is already propagating out of the
              # try block above - so any exception raised while launching/waiting for the
              # uninstall is caught here and only logged as a warning, never rethrown.
              try {
                  $updateExe = Join-Path $installDir 'Update.exe'
                  if (Test-Path $updateExe) {
                      Write-Host "Cleaning up the LICENSE-verification install..."
                      $uninstallProcess = Start-Process -FilePath $updateExe -ArgumentList @('uninstall', '--silent') -Wait -PassThru
                      if ($uninstallProcess.ExitCode -ne 0) {
                          Write-Host "::warning::Cleanup uninstall for the LICENSE verification install exited with code $($uninstallProcess.ExitCode) (non-fatal on this ephemeral runner)."
                      } else {
                          Write-Host "Cleanup uninstall completed (exit code 0)."
                      }
                  }
              }
              catch {
                  Write-Host "::warning::Cleanup for the LICENSE verification install threw and was skipped (non-fatal on this ephemeral runner): $($_.Exception.Message)"
              }
          }

      - name: Generate and validate public SHA-256 checksums
        id: checksums
        shell: pwsh
        run: |
          # Builds SHA256SUMS.txt from exactly the intended-public-asset list determined above
          # (never from a blind directory listing), so it can only ever describe files a
          # consumer can actually download from the GitHub Release - re-validated here
          # independently (existence, no duplicates) rather than trusting the prior step's
          # in-memory state, since this step is what actually decides the published manifest.
          $ErrorActionPreference = 'Stop'
          $dir = 'release-work\velopack'
          $checksumPath = Join-Path $dir 'SHA256SUMS.txt'
          $publicAssets = @('${{ steps.verify_assets.outputs.public_assets_json }}' | ConvertFrom-Json)

          $distinctAssets = @($publicAssets | Select-Object -Unique)
          if ($distinctAssets.Count -ne $publicAssets.Count) {
              throw "Intended public asset list contains duplicate entries: $($publicAssets -join ', ')"
          }

          $missing = $distinctAssets | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) {
              throw "Cannot generate SHA256SUMS.txt: expected public asset(s) missing from '$dir': $($missing -join ', ')"
          }

          $lines = $distinctAssets | Sort-Object | ForEach-Object {
              $hash = (Get-FileHash -Path (Join-Path $dir $_) -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $_"
          }
          $lines | Set-Content -Path $checksumPath -Encoding ascii
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

          Write-Host "Public SHA256SUMS.txt (only files that will actually be public GitHub Release assets):"
          Write-Host (Get-Content $checksumPath -Raw)

      - name: Upload packaged assets to workflow run
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ steps.release_info.outputs.tag }}
          path: release-work/velopack/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-logs/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Verify the release tag still exists on origin before publishing
        shell: pwsh
        run: |
          # Publication below deliberately omits --targetCommitish and relies entirely on the
          # tag named by --tag already existing (GitHub's Create Release API documents
          # target_commitish as "Unused if the Git tag already exists"). This tag is immutable
          # by policy and must never be created or moved by this workflow - so fail closed here
          # if it has somehow stopped existing on the remote, or now resolves to a different
          # commit than the product source this job actually built, between checkout and this
          # point. Re-queries origin directly (not just the local clone) and correctly
          # dereferences an annotated tag's peeled commit (the "^{}" line) rather than comparing
          # the annotated tag object's own SHA, which would never match a commit SHA.
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.release_info.outputs.tag }}'
          $expectedCommit = '${{ steps.verify_tag.outputs.commit_sha }}'
          $exactRef = "refs/tags/$tag"
          $peeledRef = "refs/tags/$tag^{}"

          # git ls-remote's <refs> argument is a glob pattern, not an exact match
          # (https://git-scm.com/docs/git-ls-remote) - "$tag*" is queried broadly enough to also
          # catch the optional peeled ref, but a prefix-sharing tag (e.g. v0.4.0-alpha.10) would
          # also match this pattern if the exact requested tag no longer existed. Every returned
          # line is therefore parsed into its own (Sha, Ref) pair and only a line whose Ref field
          # is an EXACT, full match to $exactRef/$peeledRef is ever trusted - never "the first
          # result" or a prefix match.
          $remoteTagLines = git ls-remote --tags origin "$tag*"
          $parsed = $remoteTagLines -split "`n" | Where-Object { $_ -ne '' } | ForEach-Object {
              $parts = $_ -split '\s+', 2
              [pscustomobject]@{ Sha = $parts[0]; Ref = $parts[1] }
          }

          $exactLine = $parsed | Where-Object { $_.Ref -eq $exactRef }
          if (-not $exactLine) {
              throw "Release tag '$tag' no longer exists on origin (no exact '$exactRef' ref found) - refusing to publish. This tag is immutable and must not be recreated by this workflow."
          }

          # Annotated tags report an additional exact "^{}" peeled line pointing at the commit the
          # tag targets; lightweight tags have no such line and the tag ref's own SHA already is
          # the commit.
          $peeledLine = $parsed | Where-Object { $_.Ref -eq $peeledRef }
          $actualCommit = if ($peeledLine) { $peeledLine.Sha } else { $exactLine.Sha }

          if ($actualCommit -ne $expectedCommit) {
              throw "Release tag '$tag' now resolves to '$actualCommit' on origin, not the expected product commit '$expectedCommit' - refusing to publish. The tag is immutable and must not have moved."
          }
          Write-Host "Confirmed: exact tag ref '$exactRef' exists on origin and resolves to the expected product commit '$expectedCommit'."

      # vpk upload github is the single authority that creates/updates the GitHub Release: it
      # uploads the Setup.exe, full (and delta, if present) nupkg, portable zip, and the channel
      # feed json, and --merge lets a re-run of an existing tag add to that same release instead
      # of racing a separate `gh release create` for ownership of it. SHA256SUMS.txt is not a
      # Velopack asset, so it's attached afterward with a plain `gh release upload` against the
      # release vpk just created - one authority for creation, a simple follow-up for the one
      # extra file, never two things trying to create the release.
      #
      # --targetCommitish is deliberately NOT passed. GitHub's Create Release API documents
      # target_commitish as "Unused if the Git tag already exists" - and separately, when a
      # target_commitish IS given and identifies a commit whose .github/workflows content
      # differs from the repository's default branch, GitHub requires the authenticating token
      # to be authorized to modify workflows, which the built-in GITHUB_TOKEN can never be
      # granted (this returns 403 "Resource not accessible by integration", not a permissions
      # misconfiguration - the job's own GITHUB_TOKEN Permissions block already shows
      # Contents: write). Since v0.4.0-alpha.1 was tagged before this workflow file was later
      # corrected on main, passing its old commit as --targetCommitish triggers exactly that
      # guard. Omitting the flag makes GitHub use the tag it already has (verified immutable
      # above) instead of evaluating that guard against an unrelated older commit.
      - name: Publish release via Velopack (single release authority)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prereleaseArgs = @()
          if ('${{ steps.release_info.outputs.is_prerelease }}' -eq 'true') {
              $prereleaseArgs += '--pre'
          }

          dotnet vpk upload github `
            --repoUrl $env:REPO_URL `
            --channel '${{ steps.release_info.outputs.channel }}' `
            --outputDir release-work\velopack `
            --token $env:GH_TOKEN `
            --publish `
            --merge `
            --tag '${{ steps.release_info.outputs.tag }}' `
            --releaseName "Palworld Server Manager ${{ steps.release_info.outputs.tag }}" `
            @prereleaseArgs
          if ($LASTEXITCODE -ne 0) { throw "vpk upload github exited with code $LASTEXITCODE" }

      - name: Attach checksums to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release upload '${{ steps.release_info.outputs.tag }}' '${{ steps.checksums.outputs.checksum_path }}' --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "gh release upload (checksums) exited with code $LASTEXITCODE" }
