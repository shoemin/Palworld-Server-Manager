name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and self-test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build and run self-tests
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Upload build transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-logs/*.log
          if-no-files-found: warn
          retention-days: 14

  windows-integration:
    name: Windows integration
    runs-on: windows-latest
    timeout-minutes: 25
    # GitHub-hosted windows-latest runners run as Administrator with UAC disabled, which the #41
    # harness requires to create its temporary service/group/users. The harness fails rather than
    # skipping silently if that is ever not the case, so a lost capability surfaces as a red job
    # instead of quietly reduced coverage.

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run privileged Windows integration harness
        shell: pwsh
        run: .\scripts\windows-integration.ps1
