name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  astra-spake2-wrapper:
    name: Guarded Windows SPAKE2 wrapper
    if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'astra/44-guarded-spake2' || github.ref_name == 'experiment/astra-v0.5.0')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build and qualify native wrapper
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed.' }
          $env:RUSTUP_TOOLCHAIN = '1.98.1'
          ./scripts/build-spake2.ps1
          ./scripts/build-spake2.ps1 -EntropyFailureFixture -OutputDirectory build-logs/spake2-fault
          cargo test --locked --release --manifest-path native/PalworldServerManager.Spake2/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Native lifecycle tests failed.' }
          cargo test --locked --release --manifest-path native/PalworldServerManager.Spake2/Cargo.toml --features qualification-entropy-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native entropy-failure tests failed.' }
          dotnet build PalworldServerManager.sln -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Managed build failed.' }
          dotnet run --project tests/PalworldServerManager.SelfTest -c Release --no-build -- --spake2-wrapper-probe "$PWD/build-logs/spake2-native/target/x86_64-pc-windows-msvc/release/palworld_spake2.dll" "$PWD/build-logs/spake2-fault/target/x86_64-pc-windows-msvc/release/palworld_spake2.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Managed/native qualification failed.' }

  astra-spake2-qualification:
    name: Isolated Astra SPAKE2 qualification
    if: github.event_name == 'workflow_dispatch' && (github.ref_name == 'astra/44-direct-assessment' || github.ref_name == 'experiment/astra-v0.5.0')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install pinned assessment toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed.' }
      - name: Run isolated fixtures
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = '1.98.1'
          ./tools/experiments/spake2-qualification/run.ps1
      - name: Check out pinned upstream vector suite
        uses: actions/checkout@v7
        with:
          repository: djx-y-z/pakery
          ref: 4fa353417ddddfcaaf29f990404e1f48127167e3
          path: build-logs/spake2-upstream
          persist-credentials: false
      - name: Check upstream oracle and run RFC suite
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = '1.98.1'
          Invoke-WebRequest 'https://www.rfc-editor.org/rfc/rfc9382.txt' -OutFile 'build-logs/rfc9382.txt'
          python ./tools/experiments/spake2-qualification/check-rfc-constants.py build-logs/spake2-upstream build-logs/rfc9382.txt
          if ($LASTEXITCODE -ne 0) { throw 'RFC oracle mismatch.' }
          cargo test --locked --release --manifest-path build-logs/spake2-upstream/Cargo.toml -p pakery-tests --features p256 --test spake2_p256_vectors
          if ($LASTEXITCODE -ne 0) { throw 'RFC suite failed.' }

  build-and-test:
    name: Build and self-test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build and run self-tests
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Upload build transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-logs/*.log
          if-no-files-found: warn
          retention-days: 14

  windows-integration:
    name: Windows service and multi-user integration
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build integration harness
        shell: pwsh
        run: dotnet build PalworldServerManager.sln -c Release
      - name: Run explicit privileged integration (no skip)
        shell: pwsh
        run: .\scripts\test-windows-integration.ps1
