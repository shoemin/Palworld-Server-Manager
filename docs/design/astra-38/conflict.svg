<text x="328" y="704" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Reload asks before discarding. Review retains nonsecret choices in memory; each choice is explicit.</text>
<text x="328" y="746" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Save after review submits revision 43; another change rejects again. No force overwrite or automatic merge.</text>
<text x="328" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#f6ce79">Newly typed secrets are cleared and must be re-entered; stored secrets never enter comparison or diagnostics.</text>
