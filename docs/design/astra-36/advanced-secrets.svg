<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Unknown setting preservation and secret editing states</title>
<desc id="desc">Static Astra design prototype. All names, identifiers and status values are synthetic. Read the accompanying specification for keyboard and responsive behavior.</desc>
<rect x="0" y="0" width="1600" height="900" rx="3" fill="#07131c" stroke="none" stroke-width="1"/>
<text x="40" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#e8f2f5">ADVANCED / UNKNOWN AND SECRET STATES</text>
<text x="40" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#56dcf0">Main Server · Family PC · R1 · c58a1000…a001 · independent pattern panels</text>
<rect x="40" y="132" width="480" height="572" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="64" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#e8f2f5">Unknown future key</text>
<text x="64" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8f2f5">FutureOption</text>
<text x="64" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8f2f5">Original opaque value preserved</text>
<text x="64" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Description / bounds / default: unknown</text>
<text x="64" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Edit raw is an explicit choice.</text>
<text x="64" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Other unknown fields remain unchanged.</text>
<rect x="64" y="622" width="432" height="40" rx="3" fill="#183d4e" stroke="#56dcf0" stroke-width="1"/>
<text x="76" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#56dcf0">Review raw value…</text>
<rect x="560" y="132" width="480" height="572" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="584" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#e8f2f5">Secret unchanged</text>
<text x="584" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8f2f5">Administrator password</text>
<text x="584" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8f2f5">Stored · unchanged</text>
<text x="584" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">No stored secret is returned or revealed.</text>
<text x="584" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Blank replacement does not mean delete.</text>
<text x="584" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Revert abandons only the draft replacement.</text>
<rect x="584" y="622" width="432" height="40" rx="3" fill="#183d4e" stroke="#56dcf0" stroke-width="1"/>
<text x="596" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#56dcf0">Replace password…</text>
<rect x="1080" y="132" width="480" height="572" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="1104" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#e8f2f5">Secret replacement</text>
<text x="1104" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8f2f5">Administrator password</text>
<text x="1104" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8f2f5">New value: ••••••••</text>
<text x="1104" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Only the newly typed value may be revealed.</text>
<text x="1104" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Clear stored secret is a separate action.</text>
<text x="1104" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">No logging, diagnostic copy or draft disk save.</text>
<rect x="1104" y="622" width="432" height="40" rx="3" fill="#183d4e" stroke="#56dcf0" stroke-width="1"/>
<text x="1116" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#56dcf0">Discard replacement</text>
<text x="40" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#f6ce79">Host redaction applies before every normal, raw, error, search, effective-value and comparison presentation.</text>
<text x="40" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Raw editing is a bounded setting value, not arbitrary INI file access. No unknown value is normalized on an unrelated save.</text>
<text x="40" y="842" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Conditional metadata pattern: Reset is unavailable without a known default; Revert restores the loaded configured value.</text>
</svg>
