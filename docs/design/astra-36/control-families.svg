<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">Semantic editor family patterns / conditional schema bindings</title>
<desc id="desc">Static Astra design prototype. All names, identifiers and status values are synthetic. Read the accompanying specification for keyboard and responsive behavior.</desc>
<rect x="0" y="0" width="1600" height="1060" rx="3" fill="#07131c" stroke="none" stroke-width="1"/>
<text x="40" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#e8f2f5">SEMANTIC CONTROL FAMILIES</text>
<text x="40" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">A pattern does not add a setting. Bind only to a Host definition with an established domain meaning.</text>
