<text x="1242" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8f2f5">Welcome to our world.</text>
<text x="1242" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#e8f2f5">Bring your friends.</text>
