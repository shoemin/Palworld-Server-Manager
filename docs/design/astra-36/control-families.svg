<text x="56" y="621" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f2f5">Conditional pattern</text>
<text x="56" y="676" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#a8beca">No baseline path key bound; no generic remote browser.</text>
<rect x="450" y="600" width="306" height="40" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="462" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f2f5">Host-defined setting path</text>
<rect x="820" y="566" width="740" height="132" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="836" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#56dcf0">Password</text>
<text x="836" y="621" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f2f5">Administrator password</text>
<text x="836" y="676" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#a8beca">Unchanged / Replace / explicit Clear; no stored-value echo.</text>
<rect x="1230" y="600" width="306" height="40" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
