<text x="328" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#e8f2f5">Owner and credential recovery guidance</text>
<text x="328" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">This PC · local Host 7d3a9100-1000-4000-8000-000000000001</text>
<text x="328" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Acting as: Owner · this Host · independent synthetic snapshot</text>
<path d="M0 856L1600 856" fill="none" stroke="#7291a2" stroke-width="1"/>
<text x="24" y="882" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#a8beca">Design prototype · labels are presentation, never authorization</text>
<rect x="328" y="232" width="592" height="492" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="348" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8f2f5">Owner is structural</text>
<text x="348" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Exactly one active Owner after initialization.</text>
<text x="348" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Owner status is not a role preset or grant checkbox.</text>
<text x="348" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Remote actors cannot revoke, demote or replace it.</text>
<text x="348" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Ordinary local clients have no Owner-replacement RPC.</text>
<text x="348" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">OS activation-group membership is not enrollment.</text>
<text x="348" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Non-Owner enrollment/reactivation needs Owner approval.</text>
<rect x="940" y="232" width="632" height="492" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="960" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8f2f5">Exceptional recovery is local and privileged</text>
<text x="960" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Use the accepted offline Host recovery procedure</text>
<text x="960" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">on the affected machine with actual OS privilege.</text>
<text x="960" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Offline preparation requires Host stopped and exclusive lock.</text>
<text x="960" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Intended-user completion uses the authenticated local client.</text>
<text x="960" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Lost/compromised Host credential requires fresh local trust</text>
<text x="960" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">and peer-local Owner-approved re-pairing; no old grant revival.</text>
<text x="328" y="764" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Routine rotation is different: staged credentials wait for remaining peers, or explicit Owner revocation/exclusion.</text>
<text x="328" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#f6ce79">No generic administrator console, one-click remote Owner reset, or trust-anyway bypass is introduced.</text>
</svg>
