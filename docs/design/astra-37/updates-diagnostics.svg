<text x="348" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8f2f5">Client update / this user</text>
<text x="348" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Client package state is separate from Host state.</text>
