<text x="960" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">ManageHostSettings does not include update authority.</text>
<text x="960" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Host-targeted operation; never a fake server target.</text>
