<text x="348" y="596" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">14:14 · LocalPrincipal Alice · delegated grant G102 · same target / source G101</text>
<text x="348" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">14:18 · RemoteManager R1 · request denied · missing exact-target capability</text>
<text x="348" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Audit shows actor kind, target, outcome and provenance; never pairing codes, tokens or private keys.</text>
<text x="348" y="698" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Unsupported capability / incompatible protocol: explain negotiation result; do not compare app versions.</text>
<rect x="348" y="730" width="556" height="40" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="360" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f2f5">Export history — Unsupported by this Host</text>
<text x="928" y="756" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Unavailable; no raw-file fallback</text>
<text x="328" y="828" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">This panel illustrates authorized inspection only; a denied history request reveals no hidden actor or resource data.</text>
