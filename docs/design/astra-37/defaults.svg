<text x="328" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Acting as: Owner · this Host · independent synthetic snapshot</text>
<path d="M0 856L1600 856" fill="none" stroke="#7291a2" stroke-width="1"/>
<text x="24" y="882" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#a8beca">Design prototype · labels are presentation, never authorization</text>
<rect x="328" y="232" width="592" height="224" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="348" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8f2f5">Shipped factory template</text>
<text x="348" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Host-provided · least privilege</text>
<text x="348" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Inspect actual entries; do not infer them from a label.</text>
<text x="348" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Not automatically reapplied to existing peers.</text>
<rect x="940" y="232" width="632" height="224" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="960" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8f2f5">Currently configured template</text>
<text x="960" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Custom · example configured by this Host&#x27;s Owner</text>
<text x="960" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">CreateServer → exact target: this Host</text>
<text x="960" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Applied as fresh Owner-root grants at activation.</text>
<rect x="328" y="480" width="1244" height="264" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="348" y="514" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8f2f5">Review default change · Owner only</text>
<text x="348" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Changes apply to future activations, not existing grant rows.</text>
<text x="348" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">ManagePermissions does not authorize editing this template.</text>
<text x="348" y="622" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">PeerBound gets no grants; activation uses the template configured at that time.</text>
<text x="348" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">Known-identity credential replacement still requires Owner approval; prior grants never revive silently.</text>
<rect x="348" y="682" width="220" height="40" rx="3" fill="#0d202b" stroke="#7291a2" stroke-width="1"/>
<text x="360" y="707" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f2f5">Cancel</text>
<rect x="584" y="682" width="340" height="40" rx="3" fill="#183d4e" stroke="#56dcf0" stroke-width="1"/>
<text x="596" y="707" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#56dcf0">Save future defaults</text>
<text x="328" y="806" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8beca">This is a configured-template example, not a new factory preset or an AllServers grant.</text>
</svg>
