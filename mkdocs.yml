site_name: Palworld Server Manager
site_description: Documentation for Palworld Server Manager, a Windows desktop application for managing Palworld dedicated servers.
site_url: https://shoemin.github.io/Palworld-Server-Manager/
repo_url: https://github.com/shoemin/Palworld-Server-Manager
repo_name: shoemin/Palworld-Server-Manager
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/installation.md
      - getting-started/first-server.md
      - getting-started/existing-server-import.md
  - User Guide:
      - guide/server-lifecycle.md
      - guide/settings-editor.md
      - guide/dashboard.md
      - guide/lan.md
      - guide/backups.md
      - guide/portable-packages.md
  - Manager Updates:
      - manager-updates/index.md
      - manager-updates/checking-for-updates.md
      - manager-updates/update-channels.md
      - manager-updates/update-while-server-running.md
  - Reference:
      - reference/file-locations.md
      - reference/ports.md
      - reference/security-model.md
  - Troubleshooting: troubleshooting/index.md
  - Developer Guide:
      - developer/architecture.md
      - developer/building-and-testing.md
      - developer/release-process.md
      - developer/agent-workflow.md
      - developer/v0.5-invariants.md
