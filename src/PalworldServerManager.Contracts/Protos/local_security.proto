syntax = "proto3";
package palworld.manager.v1;
option csharp_namespace = "PalworldServerManager.Contracts.Wire";
import "Protos/host.proto";
import "Protos/peer_security.proto";
import "Protos/peer_pairing.proto";

// No native caller identity, actor/Owner setter or private key is accepted from a request.
// Field numbers are permanent. Secrets must never be formatted as diagnostic messages.
message LocalEmpty {}
message LocalHandshakeReply { Handshake handshake = 1; HostIdentity host = 2; bool initialized = 3; }
message LocalPrincipalRequest { string local_principal_id = 1; }
message LocalChallenge { bytes payload = 1; }
message LocalProof { bytes signature = 1; }
// Identity evidence only; no capability grants are implied by authentication.
message LocalPrincipalIdentity { string local_principal_id = 1; bool is_owner = 2; }
message LocalEnrollmentTarget { string intended_os_principal = 1; }
message LocalEnrollmentInvitation { string ticket_id = 1; string expires_utc = 2; bytes code = 3; }
message LocalCredentialCompletion { string ticket_id = 1; bytes secret = 2; bytes public_key = 3; }
// A consumed-ticket retry returns the recorded identity, not proof of current key registration.
message LocalCredentialResult { string local_principal_id = 1; }

// Protected local-channel DTOs. Codes are ten ASCII digits, never diagnostic text.
message LocalPairingInvitation { string invitation_id = 1; string expires_utc = 2; bytes code = 3; }
message LocalPairingInvitationRequest { string invitation_id = 1; }
message LocalPairHostRequest { string reachable_host = 1; uint32 pairing_port = 2; bytes code = 3; }
message LocalPairHostReply {
  string verified_peer_host_id = 1;
  PeerPairingResult local_result = 2;
  PeerPairingResult remote_result = 3;
  string local_replacement_id = 4;
  string local_expires_utc = 5;
}
// Advisory pages over a changing unverified cache, not a trust or snapshot token.
message LocalPairingDiscoveryRequest { uint32 offset = 1; uint32 limit = 2; }
message LocalDiscoveredPairingHost {
  string claimed_host_id = 1;
  string reachable_host = 2;
  uint32 peer_port = 3;
  uint32 pairing_port = 4;
  ProtocolVersion advertised_protocol = 5;
}
message LocalPairingDiscoveryReply { repeated LocalDiscoveredPairingHost hosts = 1; uint32 next_offset = 2; }

message LocalActivatePeerRequest { string peer_host_id = 1; string reachable_host = 2; uint32 peer_port = 3; }
message LocalActivatePeerReply { PeerActivationResult result = 1; }

// Current local observations, not authorization permits or remote command routes.
enum LocalPeerTrustState {
  LOCAL_PEER_TRUST_STATE_UNSPECIFIED = 0;
  LOCAL_PEER_TRUST_STATE_PEER_BOUND = 1;
  LOCAL_PEER_TRUST_STATE_ACTIVE = 2;
  LOCAL_PEER_TRUST_STATE_REVOKED = 3;
}
message LocalPeerTrustPageRequest { string after_peer_host_id = 1; uint32 limit = 2; }
message LocalPeerTrustItem {
  string peer_host_id = 1;
  LocalPeerTrustState state = 2;
  int64 incarnation = 3;
  string current_fingerprint = 4;
  string pending_fingerprint = 5;
  bool recovery_required = 6;
}
message LocalPeerTrustPageReply {
  string authoritative_host_id = 1;
  int64 authorization_revision = 2;
  repeated LocalPeerTrustItem peers = 3;
  string next_after_peer_host_id = 4;
}
message LocalRevokePeerRequest {
  string peer_host_id = 1;
  int64 expected_authorization_revision = 2;
  int64 expected_incarnation = 3;
}
// Reports only the local commit. It never asserts reciprocal notification success.
message LocalRevokePeerReply {
  string peer_host_id = 1;
  int64 authorization_revision = 2;
  int64 incarnation = 3;
  bool changed = 4;
}

// Owner-only observations. Pending does not imply currently approvable.
message LocalPeerReplacementPageRequest { string after_replacement_id = 1; uint32 limit = 2; }
message LocalPeerReplacementItem {
  string replacement_id = 1;
  string peer_host_id = 2;
  LocalPeerTrustState expected_state = 3;
  string expected_fingerprint = 4;
  string proposed_fingerprint = 5;
  string verified_utc = 6;
  string expires_utc = 7;
}
message LocalPeerReplacementPageReply {
  string authoritative_host_id = 1;
  int64 authorization_revision = 2;
  repeated LocalPeerReplacementItem candidates = 3;
  string next_after_replacement_id = 4;
}
message LocalApprovePeerReplacementRequest { string replacement_id = 1; int64 expected_authorization_revision = 2; }
// Only local approval truth; the peer's independent recovery obligation remains separate.
message LocalApprovePeerReplacementReply {
  string peer_host_id = 1;
  string replacement_id = 2;
  int64 authorization_revision = 3;
  int64 incarnation = 4;
  bool changed = 5;
  int32 invalidated_grants = 6;
  int32 created_default_grants = 7;
}

// Reachability hints only. The Host authenticates the exact semantic peer itself.
message LocalPeerContactRequest { string peer_host_id = 1; string reachable_host = 2; uint32 peer_port = 3; }
// An ephemeral observation, never a revocation permit or delivery acknowledgement.
message LocalPreparePeerUnpairReply { bool prepared = 1; }
enum LocalPeerRecoveryPushResult {
  LOCAL_PEER_RECOVERY_PUSH_RESULT_UNSPECIFIED = 0;
  LOCAL_PEER_RECOVERY_PUSH_RESULT_CONFIRMED = 1;
  LOCAL_PEER_RECOVERY_PUSH_RESULT_NO_PENDING = 2;
  LOCAL_PEER_RECOVERY_PUSH_RESULT_KEY_MISMATCH = 3;
}
enum LocalPeerRecoveryPullResult {
  LOCAL_PEER_RECOVERY_PULL_RESULT_UNSPECIFIED = 0;
  LOCAL_PEER_RECOVERY_PULL_RESULT_CONFIRMED = 1;
  LOCAL_PEER_RECOVERY_PULL_RESULT_NO_PENDING = 2;
  LOCAL_PEER_RECOVERY_PULL_RESULT_KEY_MISMATCH = 3;
  LOCAL_PEER_RECOVERY_PULL_RESULT_UNSUPPORTED = 4;
}
// Separate intrinsic observations. No new Owner approval or cross-Host atomic result.
message LocalCompletePeerRecoveryReply { LocalPeerRecoveryPushResult sent = 1; LocalPeerRecoveryPullResult received = 2; }

message LocalRemotePeerTrustPageRequest { LocalPeerContactRequest destination = 1; string after_peer_host_id = 2; uint32 limit = 3; }
message LocalRemoteRevokePeerRequest {
  LocalPeerContactRequest destination = 1; string peer_host_id = 2;
  int64 expected_authorization_revision = 3; int64 expected_incarnation = 4;
}
service LocalSecurityProtocol {
  rpc ReadRemotePeerTrust(LocalRemotePeerTrustPageRequest) returns (PeerTrustPageReply);
  rpc RevokeRemotePeerTrust(LocalRemoteRevokePeerRequest) returns (PeerRevokeTrustReply);
  rpc Negotiate(Handshake) returns (LocalHandshakeReply);
  rpc IssueChallenge(LocalPrincipalRequest) returns (LocalChallenge);
  rpc Authenticate(LocalProof) returns (LocalPrincipalIdentity);
  rpc GetIdentity(LocalEmpty) returns (LocalPrincipalIdentity);
  rpc CreateEnrollment(LocalEnrollmentTarget) returns (LocalEnrollmentInvitation);
  rpc RevokePrincipal(LocalPrincipalRequest) returns (LocalEmpty);
  rpc CompleteBootstrap(LocalCredentialCompletion) returns (LocalCredentialResult);
  rpc CompleteEnrollment(LocalCredentialCompletion) returns (LocalCredentialResult);
  rpc CompleteOwnerRotation(LocalCredentialCompletion) returns (LocalCredentialResult);
  rpc CompleteOwnerRehome(LocalCredentialCompletion) returns (LocalCredentialResult);
  rpc CreatePairingInvitation(LocalEmpty) returns (LocalPairingInvitation);
  rpc CancelPairingInvitation(LocalPairingInvitationRequest) returns (LocalEmpty);
  rpc DiscoverPairingHosts(LocalPairingDiscoveryRequest) returns (LocalPairingDiscoveryReply);
  rpc PairHost(LocalPairHostRequest) returns (LocalPairHostReply);
  rpc ActivatePeer(LocalActivatePeerRequest) returns (LocalActivatePeerReply);
  rpc ReadPeerTrust(LocalPeerTrustPageRequest) returns (LocalPeerTrustPageReply);
  rpc RevokePeerTrust(LocalRevokePeerRequest) returns (LocalRevokePeerReply);
  rpc ReadPeerReplacements(LocalPeerReplacementPageRequest) returns (LocalPeerReplacementPageReply);
  rpc ApprovePeerReplacement(LocalApprovePeerReplacementRequest) returns (LocalApprovePeerReplacementReply);
  rpc PreparePeerUnpair(LocalPeerContactRequest) returns (LocalPreparePeerUnpairReply);
  rpc CompletePeerRecovery(LocalPeerContactRequest) returns (LocalCompletePeerRecoveryReply);
}
