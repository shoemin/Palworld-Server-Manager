syntax = "proto3";
package palworld.manager.v1;
option csharp_namespace = "PalworldServerManager.Contracts.Wire";
import "Protos/host.proto";

// Schema reads and value observation DTOs; no save command.
// Field numbers are permanent. Removed names/numbers must be reserved.
enum SettingsEditorKind {
  SETTINGS_EDITOR_KIND_UNSPECIFIED = 0;
  SETTINGS_EDITOR_KIND_RAW = 1;
  SETTINGS_EDITOR_KIND_BOOLEAN = 2;
  SETTINGS_EDITOR_KIND_INTEGER = 3;
  SETTINGS_EDITOR_KIND_MULTIPLIER = 4;
  SETTINGS_EDITOR_KIND_DURATION = 5;
  SETTINGS_EDITOR_KIND_ENUM = 6;
  SETTINGS_EDITOR_KIND_TEXT = 7;
  SETTINGS_EDITOR_KIND_PASSWORD = 8;
  SETTINGS_EDITOR_KIND_COMPOUND = 9;
}
enum SettingsSensitivity {
  SETTINGS_SENSITIVITY_UNSPECIFIED = 0;
  SETTINGS_SENSITIVITY_UNKNOWN = 1;
  SETTINGS_SENSITIVITY_NONSECRET = 2;
  SETTINGS_SENSITIVITY_SECRET = 3;
}
enum SettingsValidationCode {
  SETTINGS_VALIDATION_CODE_UNSPECIFIED = 0;
  SETTINGS_VALIDATION_CODE_VALID = 1;
  SETTINGS_VALIDATION_CODE_UNSUPPORTED = 2;
  SETTINGS_VALIDATION_CODE_BOOLEAN_REQUIRED = 3;
  SETTINGS_VALIDATION_CODE_INTEGER_REQUIRED = 4;
  SETTINGS_VALIDATION_CODE_FINITE_NUMBER_REQUIRED = 5;
  SETTINGS_VALIDATION_CODE_KNOWN_CHOICE_REQUIRED = 6;
  SETTINGS_VALIDATION_CODE_SINGLE_LINE_REQUIRED = 7;
  SETTINGS_VALIDATION_CODE_EXPLICIT_SECRET_ACTION_REQUIRED = 8;
}
message SettingsDefinition {
  string key = 1;
  string display_name = 2;
  string category = 3;
  string description = 4;
  SettingsEditorKind editor_kind = 5;
  bool is_known = 6;
  SettingsSensitivity sensitivity = 7;
  bool supports_semantic_edit = 8;
  optional string unit = 9;
  repeated string choices = 10;
  // Exact invariant decimal text, only when authoritative metadata exists.
  optional string minimum = 11;
  optional string maximum = 12;
  optional string step = 13;
  optional string catalog_default = 14;
  optional bool restart_required = 15;
}
message SettingsValueObservation {
  // Decoded nonsecret text. A historical value can fail current edit validation.
  string value = 1;
  SettingsValidationCode validation = 2;
}
message SettingsEntry {
  SettingsDefinition definition = 1;
  // Absent for secret/unknown sensitivity; never masked placeholder values.
  SettingsValueObservation configured = 2;
  SettingsValueObservation installation_default = 3;
  // Only an authoritative runtime observer may supply this; no fallback inference.
  SettingsValueObservation effective = 4;
}
message SettingsSnapshot {
  ServerRef server = 1;
  // Canonical invariant decimal RevisionId (nonnegative int64), increasing at the
  // authoritative store. Clients compare/return it unchanged; never a content hash.
  string revision = 2;
  repeated SettingsEntry entries = 3;
}

// Known catalog metadata only; not a claim that a key occurs in this installation.
// Additional discovered keys are described in SettingsSnapshot entries.
message SettingsSchemaRequest { ServerRef server = 1; }
message SettingsSchemaReply { ServerRef server = 1; repeated SettingsDefinition definitions = 2; }
