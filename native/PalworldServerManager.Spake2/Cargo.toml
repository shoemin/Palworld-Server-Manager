[package]
name = "palworld-spake2"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
qualification-entropy-failure = []

[dependencies]
pakery-core = { git = "https://github.com/djx-y-z/pakery", rev = "4fa353417ddddfcaaf29f990404e1f48127167e3", default-features = false }
pakery-spake2 = { git = "https://github.com/djx-y-z/pakery", rev = "4fa353417ddddfcaaf29f990404e1f48127167e3" }
pakery-crypto = { git = "https://github.com/djx-y-z/pakery", rev = "4fa353417ddddfcaaf29f990404e1f48127167e3", default-features = false, features = ["std", "spake2", "p256"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
getrandom = "0.3.4"
rand_chacha = "0.9.0"
rand_core = "0.9.5"
zeroize = "1.9.0"
sha2 = "0.10.9"
hkdf = "0.12.4"
hmac = "0.12.1"

[workspace]
